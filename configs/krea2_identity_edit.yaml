name: krea2_identity_edit
pipeline: krea2

# Krea 2 Turbo FP8 + community Identity Edit LoRA (two-image head/face swap).
# Scene = body (Picture 1), person = face (Picture 2) — fixed training order.
# Requires: comfyui-krea2edit custom nodes + recent ComfyUI (CLIP type krea2).
#
# === Sampling latency (T4) ===
# Profile showed ~160s in diffusion alone with force_full_load=false — that is
# Comfy NORMAL_VRAM streaming UNet weights CPU↔GPU every step (~20s/step).
# force_full_load=true keeps the UNet fully on GPU during KSampler (CLIP is
# unloaded first). Quality unchanged; residency only.
#
# Author Turbo rec: 8 steps, CFG disabled (0) for pure T2I.
# Identity-Edit LoRA rec: Turbo 8–12 steps, CFG 1.0 — we keep cfg=1.0.
unet_name: krea2_turbo_fp8_scaled.safetensors
clip_name: qwen3vl_4b_fp8_scaled.safetensors
clip_type: krea2
vae_name: qwen_image_vae.safetensors

identity_lora_name: krea2_identity_edit_v1_2_r64.safetensors
identity_lora_strength: 1.0

steps: 8
# 1.8, not 1.0. At cfg=1.0 there is NO classifier-free guidance, so the text
# prompt carries zero weight and the edit is driven almost entirely by the
# reference images. That is why the head swapped correctly on every render
# (image-driven) while "change the body's skin colour to match" was ignored on
# every render (prompt-driven) -- and why repeatedly rewriting that clause
# changed nothing. Costs ~2x sampling time (two UNet evals per step).
# Lower toward 1.3-1.5 if renders come back over-saturated or crunchy.
cfg: 1.8
sampler: euler
scheduler: simple
seed: 46
denoise: 1.0

# Match Turbo distilled timestep shift (mu=1.15) when ModelSamplingFlux exists.
apply_timestep_shift: true
timestep_shift_mu: 1.15
timestep_base_shift: 0.5

# REQUIRED for T4 speed — without this, expect ~10–30s per denoising step.
force_full_load: true

# Software speed knobs (quality-preserving). Expected impact on T4:
#   silence krea2edit flush prints + no progress bar: ~1–5% sample (sync removal)
#   inference_mode + TF32/SDPA prefs: small, free
#   shared runtime / model cache (2nd image same kernel): ~25s bootstrap + ~7s load → ~0
#   debug_count_unet_forwards: leave false (Python wrap per forward)
#   torch_compile: false on cold single-image; true on A100 multi-image after warm compile
skip_negative_grounding: true
debug_count_unet_forwards: false
torch_compile: false
torch_compile_mode: reduce-overhead
save_debug: false
verbose: false

# Raised from 3.5: GPU A/B (2026-08-11) confirmed ref_boost=7.0 gives
# noticeably better donor identity fidelity than 3.5, including hair --
# consistent with the hair-color measurement showing generated hair sitting
# much closer to the TARGET's own hair than the donor's at ref_boost=3.5
# across 3 seeds (distances ~55-71 to donor vs ~9-20 to target). Stronger
# image-reference conditioning is the correct lever here, not more prompt
# text -- cfg=1.0 (required by this distilled checkpoint) already caps how
# much the text prompt alone can steer generation.
ref_boost: 7.0
ref_boost_a: 1.6
grounding_px: 768
fit_mode: fit
max_dim: 768
div_by: 16

# Locality (mask → crop → edit → soft stitch → LAB)
# Same shell as Klein promote / Qwen improved. Diffusion still Krea2 dual-ref
# on the crop (Picture 1 = body crop, Picture 2 = face). Set false for full-frame A/B.
mask_crop_stitch: true
# tight = production head crop (~768 long side). wide = larger shoulder/torso
# crop resized to ~1MP (experimental; keep neighbor clamp). OFF by default.
crop_margin_mode: tight
wide_crop_target_mp: 1.0
wide_crop_min_mp: 0.85
wide_crop_max_mp: 1.15
wide_crop_max_dim: 1536
wide_crop_allow_upscale: true
wide_crop_pad_top_frac: 1.20
wide_crop_pad_side_frac: 1.80
wide_crop_pad_bot_frac: 2.50
# Landmark Procrustes on the edited crop before stitch (crop_stitch path).
# Corrects head yaw/eye-gaze drift toward the donor face by re-aligning the
# generated crop's landmarks onto the ORIGINAL photo's, in content-local
# (crop-space) coordinates -- it can only ever move pixels that started out
# inside the tight head crop, never distant content like hair/background, so
# it cannot reproduce the "floating fragment" failure a whole-image pose warp
# can (see head_direction_relock, which does exactly that and is disabled
# for this reason). The sanity gates below reject a bad landmark fit instead
# of applying it.
#
# GPU-measured 2026-08-09 on the hat/full-body case: even a PASSING,
# in-bounds correction (scale=0.906, rot=5.0deg, inliers=5, residual=12.4px --
# well inside every gate above) produced a bright halo hugging the head in
# the sky. Root cause isolated with an edge-energy probe: mean |Laplacian| on
# a dilated/eroded band around the correction's blend ellipse was 1.25x the
# surrounding sky (0.226 vs 0.181 over ~9.3k px) -- a real photometric seam
# where the warped crop is blended back through
# procrustes_align_edited_crop_to_body_box's face-only ellipse. The old hat's
# original silhouette was ruled out first (edge energy 0.96x, i.e. no seam)
# before finding this. Turning the flag off removed the halo completely on a
# real render, with identity/expression/gaze unaffected. Off by default until
# a version of this correction composites through the same tight head_matte
# mask the rest of the pipeline uses, instead of its own ellipse.
enable_procrustes_correction: true
procrustes_alignment: jaw
procrustes_jaw_min_inliers: 4
procrustes_mask_blend_feather_px: 8
procrustes_min_inliers: 3
procrustes_min_scale: 0.40
procrustes_max_scale: 2.50
# Sanity gates — any breach falls back to the uncorrected crop instead of
# warping the head off-register (the floating face/hair fragment failure).
procrustes_max_rotation_deg: 12.0
procrustes_max_translate_frac: 0.25
procrustes_max_residual_frac: 0.06
max_body_dim: 1024
# Upscale SMALL inputs to this long side before any cropping. Without it a
# small source caps final quality regardless of pipeline changes: the head
# crop is taken in the body image's own pixels, so a 350x197 photo gives a
# ~128x112 crop -- the model samples that at crop_long_side and generates a
# detailed head, but it is then scaled back to 128x112 to composite and the
# output is 350x197, discarding all of it. Set to 0 to disable (old
# downscale-only behaviour). Capped by max_body_dim above.
body_min_long_side: 1024
crop_long_side: 768
square_crop: false
mask_expand_px: 18
mask_blur_px: 12
# Tall top_extend so original hair is inside the edit/stitch region (otherwise
# body hair survives outside the mask while only the face is replaced).
# Tried raising this to 0.55 to push the mask past the collarline (2026-08-10)
# -- GPU-verified WORSE: the mask then reached far enough down to include the
# donor's edited-crop necklace/collar content, which got pasted straight over
# the target's own clothing -> visible double necklace/double collar. Reverted
# to 0.40. The neck seam needs a THIN-BAND fix (feather + alpha-tail cleanup +
# mild local LAB), not a bigger mask -- a bigger mask composites more of the
# edited crop's own (wrong) clothing, not more skin.
# Reduced from 1.55 (2026-08-18): on tall/stylized headwear (pair2, a black
# hat extending well above the face), Krea2 reliably paints the region near
# the face correctly but fails to continue the hat's own color/shape in the
# outer ~1/3 of the extended region -- confirmed via a raw pre-composite
# dump (isolated_layer_rgb.png) showing a cream/beige patch baked directly
# into the model's own output, not a compositing/masking bug (both the mask
# and the compositing math were independently verified correct on the same
# run). Building around that limitation rather than continuing to chase it
# as a bug: asking for less area lets the untouched original headwear show
# at the very top instead of a wrong-colored patch. 1.55 was tuned to keep
# a target's own hair fully inside the mask on OTHER cases -- watch for
# short-hair/no-headwear cases regressing if this needs to go lower still.
# run_simple_full_body's face-local refine pass sends a LARGER context crop
# to the model than the blend mask uses (see refine_context_*_extend below)
# -- more neck/shoulder/torso context + higher effective face resolution,
# while the mask that pastes the refined result back stays this tight to
# avoid repainting the target's own collar/clothing.
refine_context_side_extend: 0.85
refine_context_bot_extend: 0.95
mask_top_extend: 1.30
mask_side_extend: 0.60
mask_bot_extend: 0.40
stitch_feather_px: 10
post_color_match_strength: 0.35
# Restrict WHERE that strength is painted back to a thin ring at the mask
# boundary (px), not the whole head. Un-gated, this pulled the donor's own
# skin tone partway back toward the target's original tone everywhere under
# the mask -- including the untouched face interior -- which reads as the
# swap "losing" identity skin color, not just a smoothed seam (2026-08-10).
post_color_match_edge_only_px: 24
# Separately, tint the sliver of the target's ORIGINAL exposed neck just past
# the paste mask edge toward the donor's own tone (color only, no new content
# pasted -- unlike widening the paste mask itself, which pastes the edited
# crop's own clothing over the target's real clothes). Without this the
# donor-toned face sits directly next to an un-recolored original-tone neck
# stub and reads as a tone seam even though the paste/feather geometry is
# otherwise correct (2026-08-10).
# Soft mid-alpha under-chin ghost collapse (prefer edited); cloth-safe
# two-pass neck_stub ring. Does NOT widen mask_bot_extend or turn on
# post-stitch crop_stitch_clamp_head_scale.
neck_stub_tone_match: true
neck_stub_tone_match_ring_px: 90
neck_stub_tone_match_interior_erode_px: 20
neck_stub_tone_match_strength: 0.75
neck_stub_tone_match_l_strength: 0.95
neck_stub_tone_match_ab_strength: 1.0
neck_stub_tone_match_passes: 2
neck_stub_tone_match_ab_gate_scale: 26.0
neck_stub_tone_match_blur_frac: 0.14
collapse_soft_chin_ghost: true
collapse_soft_chin_ghost_mid_lo: 0.08
collapse_soft_chin_ghost_mid_hi: 0.92
collapse_soft_chin_ghost_chin_frac: 0.35
# Single-person: dilate opaque stitch core a few px (covers old jaw sliver).
stitch_mask_dilate_px: 12

# --- Dual mask: generation vs harmonization --------------------------------
# Generation mask (head_matte + mask_*_extend) controls Krea2 regen and stitch
# geometry only. Harmonization mask is wider, skin-adaptive, color-only.
harmonization_enabled: true
harmonization_dilate_px: 24
harmonization_bot_extend: 0.15
harmonization_skin_thresh: 0.45
# Raised from 0.55: math is directionally correct (shifts the neck/body ring
# toward the donor tone sampled from deep inside the generated head, not the
# reverse), but 0.55 only gets partway there, leaving a muddy in-between tone
# that reads as "wrong" rather than a clean match to either person
# (2026-08-11 user report). 0.85 pulls it most of the way to the donor's
# actual tone while keeping the feathered falloff so it doesn't read as a
# hard-edged recolor.
harmonization_strength: 0.85
harmonization_feather_px: 16
harmonization_include_arms: true

# Multi-person production (decision-gate YES_ARCHITECTURE):
#   detect faces → select one → SAME single-person crop recipe → Krea2 → stitch.
#   Allowed multi-only logic: face select + neighbor exclusion from crop.
#   krea2_crop + single_person_parity (default) — production path.
#   align_paste / geometry_lock — DEPRECATED A/B control only (different
#   conditioning; cannot reach single-person quality by construction).
multi_person_swap_mode: krea2_crop
# OFF by default: hard-freezing neighbor faces after stitch can overwrite the
# selected head/hair when protect ellipses overlap. Prefer clamp_crop_away_neighbors.
multi_crop_hard_freeze_neighbors: false
# Crop clamp protects the full head/hair mask extents (mask_top/side/bot_extend),
# so it can never slice the stitch region; only margin_frac is tunable.
clamp_crop_away_neighbors: true
neighbor_crop_margin_frac: 0.18
# DEPRECATED align_paste knobs (A/B only; do not tune for production identity):
align_paste_krea2_refine: true
align_paste_refine_steps: 6
align_paste_seamless_clone: true
# NORMAL_CLONE = Poisson lighting (safe). MIXED_CLONE smears on night/flash photos.
align_paste_seamless_mode: normal
# Full 6-DOF affine locks looking direction onto the destination.
align_paste_full_affine: true
# Pose relock only runs when refine is applied (see align_paste_swap.py).
align_paste_pose_relock: true
align_paste_crop_pad_frac: 1.15
align_paste_mask_expand_px: 6
align_paste_mask_blur_px: 8
# Face-only stitch mask — preserve hair; avoid night-sky halos.
align_paste_mask_top: 0.28
align_paste_mask_side: 0.28
align_paste_mask_bot: 0.18
align_paste_stitch_feather_px: 8
align_paste_post_color_match: 0.35
pre_color_match_strength: 0.65
paste_core_min_alpha: 0.90
paste_feather_px: 17
paste_ellipse_scale_x: 1.85
paste_ellipse_scale_y: 2.15
# Clothing-free identity matte (align_paste path only).
face_matte_top_pad: 0.28
face_matte_bot_pad: 0.06
face_matte_side_pad: 0.10
face_matte_force_ellipse: true

# Multi-person (>1 detected face) modes when swap_mode=krea2_crop:
#   crop_stitch — SPP-CC single-person crop recipe (default)
#   full_frame  — dark multi-person route (A/B winner) or manual A/B
multi_person_edit_mode: crop_stitch
single_person_parity: true
# --- Lighting-based multi-person routing (OFF by default) ---
# When true: after face detection, if faces>1 compute mean HSV-V luminance and
#   dark  -> full_frame (full v1.2 LoRA + ref_boost=4 via overrides below)
#   else  -> crop_stitch (production r64 + ref_boost=3.5)
# Single-person: never lighting-checked; stays on existing crop_stitch path.
enable_lighting_route: true
# Mean OpenCV HSV Value [0,255] over the target face (fallback: full frame).
# Below threshold => dark. Tune on real night/day multi-person photos.
dark_lighting_threshold: 110.0
# --- Body-detection routing (auto full_frame for full/half-body photos) ---
# When true: after face detection (single- or multi-person), classify
# portrait/close-up vs full/half-body framing. If a full body is detected,
# route this image to full_frame (correct body/head proportions) with the
# same identity-boost overrides the dark lighting route uses, so full_frame
# keeps as much crop_stitch-level face quality as the existing recipe allows.
# If no full body is detected, config is left untouched and crop_stitch runs
# exactly as before. Only ever adds a path to full_frame — never forces
# crop_stitch off, and never overrides an explicit crop_stitch-only request
# unless a full body is actually detected in that image.
enable_body_route: true
# Fallback geometric heuristic (always available, no extra deps): face bbox
# height as a fraction of image height must be <= this to be "small enough"
# to suggest a body shot, AND the frame remaining below the chin must be
# >= body_route_below_face_frac_min.
body_route_face_height_frac_max: 0.30
body_route_below_face_frac_min: 0.38
# When true (and rembg is installed): refine the heuristic above using an
# actual whole-person alpha matte (reuses segmentation.py's BiRefNet/rembg
# path, ungated). Person bbox height / image height >= this => full body.
# Falls back to the geometric heuristic above when rembg is unavailable.
body_route_use_segmentation: true
body_route_person_height_frac_min: 0.55
# --- Full-frame A/B knobs (IGNORED while multi_person_edit_mode=crop_stitch) ---
# Author Identity Edit guidance: pass the FULL scene (~1–1.5MP), not a head crop.
# Production stays crop_stitch; lighting route or manual flip uses full_frame.
full_frame_target_mp: 1.5
full_frame_min_mp: 1.25
full_frame_max_mp: 1.5
full_frame_max_dim: 2048
# Do not invent detail on tiny sources (e.g. night_group ~0.12MP).
full_frame_allow_upscale: false
# Applied ONLY when multi_person_edit_mode=full_frame (lighting route or manual).
# WAS krea2_identity_edit_v1_2.safetensors (non-r64, the d_ff_full_rb4 A/B
# winner). Now the r64 variant crop_stitch uses: the refine pass regenerates
# the head from this same loaded bundle, and setting
# multi_person_edit_mode="crop_stitch" around its _sample_edit only switches
# ref_boost/grounding_px -- NOT the LoRA weights. So the face pass was running
# non-r64 while crop_stitch (the known-good face-quality path) runs r64. This
# is the biggest full_frame FACE QUALITY lever and costs nothing (single
# bundle, no extra UNETLoader). The old A/B winner applied to pass 1, which
# now only supplies body proportions/placement -- the head is regenerated by
# the refine pass regardless, so the non-r64 upside there is largely moot.
full_frame_identity_lora_name: krea2_identity_edit_v1_2_r64.safetensors
full_frame_ref_boost: 4.0
# Face detection backend: "current" (InsightFace/OpenCV, default) | "magic_hour".
# Magic Hour returns face crop path/url only — no boxes/landmarks — so it cannot
# fully replace current geometry; when selected we still use current for FaceBox.
face_detection_backend: current
# Optional: Magic Hour asset path/URL. If empty and backend=magic_hour, the body
# image is uploaded via /v1/files/upload-urls automatically.
magic_hour_target_file_path: null
magic_hour_confidence_score: 0.5
magic_hour_max_wait_s: 120.0
# head_matte = ellipse AND a real foreground/person matte (rembg), so the mask
# follows the ACTUAL head silhouette instead of enclosing background.
# Measured on a short-haired subject, small face in a full-body frame:
#   ellipse    -> 121px of EMPTY SKY above the real head (0.98x face height)
#   head_matte ->  13px                                  (0.11x face height)
# That empty headroom is not cosmetic: crop_with_mask derives the crop box
# from the mask, so the model was being handed a big oval of sky, regenerating
# it imperfectly (the visible arc ON the mask boundary) and inventing hair to
# fill the space. 9x reduction in the region it can hallucinate into.
# Falls back to `ellipse` automatically if rembg is not installed.
head_mask_backend: head_matte
# Dilates the matte before intersecting, so a donor hairstyle slightly larger
# than the target's still has room to grow. 0.0 pins new hair to the old
# silhouette exactly (the failure HID names, arXiv 2503.00861) -- and this
# was shipping at 0.0, unaddressed, despite this comment already naming the
# risk. GPU-verified 2026-08-09 on the hat/full-body case: at 0.0 the donor's
# voluminous dreadlocks render visibly flattened/thinned, pinned to the
# original (hat-covered, small) head silhouette -- exactly the "chopped off"
# look. 0.20 lets hair grow naturally; full-body visual comparison confirms
# markedly fuller, more natural hair with no other regression. Background
# invariant stays >99.98% exact (measured against the plate); a residual
# ~30-75px micro-seam can appear at isolated hair-wisp edges (max ~100/255
# there) but was not visible in the full-body render at normal viewing scale
# -- only detectable via aggressive pixel-diff + 3x zoom on a 100px crop.
# Raising restore_background's dilate_px does not clean this up (tested
# 5/9/14/20 -- max diff stays 83-120 throughout, mean gets WORSE since a
# wider dilate pulls in more background near every edge, not just this one),
# so it is left at its default.
head_matte_hair_margin_frac: 0.20
# Edge softness follows the mask TYPE, applied only when a matte backend is
# actually installed (the ellipse fallback keeps the wide values above).
# GPU-measured on the hat case -- worst-case altered background pixel and
# fraction of background touched:
#   wide edge (blur 12 / feather 10 / margin 0.08): max 168, 0.204%
#   tight edge (blur 3 / feather 3 / margin 0.0)  : max  76, 0.034%
# A generous feather made sense for the ellipse, which only approximates the
# head; on a real silhouette it straddles the true edge and regenerates a rim
# of background -- the thin halo hugging the subject.
head_matte_tight_edge: true
head_matte_expand_px: 6
head_matte_blur_px: 3
# Tight matte edge. Feather=8 after iter-3 feather=12 showed soft/sky rim at collar.
# Post-stitch local-box clamp stays OFF.
head_matte_stitch_feather_px: 8
seam_refine: false
seam_refine_erode_px: 8
seam_refine_dilate_px: 16
seam_refine_strength: 0.85
seam_refine_blur_px: 6
multi_full_frame_max_dim: 1024
# After full-frame sample: soft-composite onto the original body using a
# selected-face(+hair) mask, then hard-copy neighbor faces from the original.
# This freezes neighbors/clothes/BG while keeping full-frame head quality.
# (Debug path only while multi_person_edit_mode=full_frame.)
full_frame_freeze_outside: true
full_frame_hard_freeze_neighbors: true
# Slightly tighter sides than crop-stitch so the freeze mask does not bleed
# onto the person standing next to the selected face.
full_frame_mask_top_extend: 1.55
full_frame_mask_side_extend: 0.42
# Cut from 0.40: combined with blur/dilate/feather below, the soft-alpha
# reach below the chin was ~144px -- enough to land ON hands/forearms in a
# praying/hands-near-chin pose, blending Krea2's raw (possibly pose-shifted)
# generated frame with the original there instead of freezing it -> ghosted
# hands. 0.18 still covers neck/collar, not chest-level hands.
full_frame_mask_bot_extend: 0.18
full_frame_mask_expand_px: 12
full_frame_mask_blur_px: 12
full_frame_freeze_dilate_px: 4
full_frame_freeze_feather_px: 12
# Keep neighbor carve moderate — aggressive shrink on tight groups wiped the
# selected-head mask and made freeze look like a no-op swap.
full_frame_neighbor_suppress_shrink: 1.05
full_frame_min_selected_mask_frac: 0.35
# Tight pads + protect ellipse so neighbor restores cannot overwrite the swap.
full_frame_neighbor_pad_frac: 0.22
full_frame_neighbor_top_frac: 0.35
full_frame_protect_expand: 1.20
# LAB mean-shift applied to the head mask region post-freeze.
# 0.15 = correct only seam-boundary discontinuity; higher values re-skin the
# entire generated face back toward the original (kills identity at ≥0.45).
full_frame_post_color_match_strength: 0.15
# ON by default for full-frame mode to close the identity gap while keeping head-scale ~1.0.
full_frame_ref_boost_mask: true
# Match successful crop_stitch identity prep: full-bleed resize_contain onto
# the scene canvas (NOT place_face_at_height_frac stickers). Only intentional
# difference vs crop_stitch should be scene = full body vs head crop.
full_frame_match_crop_identity: true
# Use the same prompt builder as crop_stitch (_prompt_for_edit). Do not append
# full_frame-only locality essays (those are a prompt divergence).
full_frame_use_crop_prompt: true
# Post-sample clamp: if the generated head in `out` is taller than the
# target's real detected face (from body_full) by more than
# max_edited_head_height_ratio, shrink+recenter `out` about the detected
# face center back toward target_edited_head_height_ratio. Uses the SAME
# face-detection anchor (detect_best_face) as everything else in this
# pipeline -- this is the existing, already-built mechanism for correcting
# full_frame head scale/position, it just wasn't reachable for the
# single-person full-body route (see the code comment at the call site).
# Originally OFF because "the full GROUP frame can target the wrong face"
# via detect_best_face's blind pick -- that risk is specifically a
# multi-person (>1 face) concern and doesn't apply to the single-person
# case this is now scoped to.
full_frame_clamp_head_scale: false
# Landmark Procrustes (rotation+uniform scale+translation) after full_frame
# sample, before freeze. OFF by default — enable for A/B when head_to_body
# scale ratio is still meaningfully off 1.0 after promoting full_frame.
full_frame_procrustes_align: false
# Grounding (VLM) encode resolution for full_frame only. Reverted to the shared
# default 768 (2026-08-18) — the 1024 test results were inconclusive, not a
# validated improvement (see docs/PIPELINE_STATE.md CHECKPOINT-02). crop_stitch
# is unaffected (only applied when multi_person_edit_mode resolves to full_frame).
full_frame_grounding_px: 768
# Second-pass face refine on top of full_frame: re-detects the (already
# proportion-correct) head in the full_frame output, crops+masks it exactly
# like the normal single-person crop_stitch path, re-samples just that
# region at native crop_stitch resolution/grounding, and stitches it back
# with the same feathered composite + LAB match crop_stitch uses. Only
# pixels inside the head+hair mask can change — body/limb geometry from the
# full_frame pass is untouched by construction. This is the main lever for
# closing the full_frame vs crop_stitch face-quality gap while keeping
# full_frame's body proportions.
full_frame_face_refine: true
# When true, reload the model bundle with the crop_stitch identity LoRA
# (identity_lora_name, e.g. the r64 variant) for the refine pass instead of
# reusing the full_frame LoRA already loaded for pass 1. More faithful to
# "true" crop_stitch quality, but costs a fresh UNETLoader (extra VRAM/time).
# Kept OFF: reloading would keep BOTH UNET bundles resident for the whole
# run (persistent double-UNET VRAM, not a transient spike) -- too costly on
# T4/Colab. The same r64-face-quality win is achieved for free by pointing
# full_frame_identity_lora_name at the r64 LoRA below (single bundle).
full_frame_face_refine_reload_lora: false
# Landmark-align the refine crop onto the ORIGINAL body_full (not the
# first-pass full_frame output, which may itself carry gaze/pose drift)
# before stitching -- same content-local, inlier/residual-checked
# procrustes_align_edited_crop_to_body_box used by enable_procrustes_correction
# above, reused here because it is scoped to the tight head crop and cannot
# drag in distant content the way a whole-image pose warp can. Also gated by
# _blend_procrustes_face_only, which only lets the warp affect a tight
# face-only ellipse (fixes the streaky-sky bug this originally caused).
# OFF by default here specifically (crop_stitch's enable_procrustes_correction
# stays on): the full_frame refine pass ALREADY stitches once (first-pass
# freeze composite), and stacking this pass's own stitch-with-warp on top of
# that is a second compositing seam in the same head/hair region -- more
# opportunity for a faint boundary ghost than crop_stitch's single stitch.
# Re-enable once validated on real full_frame + refine runs.
full_frame_face_refine_procrustes: false

# Multi-person body photos: pick which face to swap, then tighten the crop so
# neighbors are not in the edit canvas (fixes giant-head / wrong-person fails).
# policy: largest | rightmost | leftmost | index
body_face_policy: largest
body_face_index: 0
# --- Multi-face product features (intentionally OFF for now) ---
# Current product: always automatic single-face swap (primary face via policy).
# Set enable_multi_face_features: true later to re-enable:
#   - Colab face picker UI (Swap All / Swap Face N)
#   - face_swap_mode: all  (N× Krea2 passes + stitch)
# Implementation is kept intact in krea2.py / colab_demo.py / notebook.
enable_multi_face_features: false
# single = one face (policy/index). all = one Krea2 pass per detected face,
# then stitch each result into the same canvas (Colab "Swap All Faces").
# Ignored while enable_multi_face_features is false (forced to single).
face_swap_mode: single
person_match_crop_size: true
force_tight_head_crop: false
group_aspect_thresh: 1.25
group_face_area_frac: 0.12
face_white_bg: false
# White-ellipse identity sticker (legacy group experiment). OFF by default —
# compare_single_vs_multi showed it makes multi person≠single person input.
face_white_bg_on_tight: false
# Do not enter legacy multi_mask_* recipe just because faces>1 or face is small.
tight_on_small_face: false
# Keep prompt identical to single-person unless debugging.
multi_extra_prompt: false
# Multi-person / small-face profile retained for opt-in (force_tight_head_crop).
multi_mask_top_extend: 1.65
multi_mask_side_extend: 0.48
multi_mask_bot_extend: 0.48
multi_mask_expand_px: 16
multi_mask_blur_px: 14
multi_crop_pad: 14
multi_target_face_fill: 0.16
multi_min_crop_long: 448
# Keep inference long-side identical to single-person (768) by default.
multi_boost_crop_long: false
multi_crop_long_side: 896
isolate_mask_side_extend: 0.70
# Extra upward pad so group-shot messy hair is inside the crop+mask.
isolate_mask_top_extend: 1.70
isolate_mask_expand_px: 22
isolate_crop_pad: 14
multi_stitch_feather_px: 14
multi_stitch_mask_dilate_px: 14
multi_post_color_match_strength: 0.55
# Match donor face height to measured scene face height via place_face_at_height_frac.
# Re-enabled under SPP (krea2_crop) for oversized-head A/B — single-person still
# uses resize_contain (scale_match requires multi_person or isolate_selected).
identity_scale_match: true
identity_scale_factor: 0.95
identity_hair_height_boost: 1.30
# Extra shrink on donor person-ref after face-frac normalize (full-body head size).
donor_scale_normalize: true
donor_scale_factor: 0.78
clamp_edited_head_scale: true
max_edited_head_height_ratio: 1.08
target_edited_head_height_ratio: 0.94
# Clamp now corrects BOTH directions. Below this ratio the generated head is
# too SMALL and gets grown (previously impossible -- scale was hard-capped at
# 1.0, so an undersized head kept its wrong proportions silently).
min_edited_head_height_ratio: 0.92
max_edited_head_grow: 1.45
# OFF by default (2026-08-10 / 2026-08-11). The local-box shrink+paste path
# produced: (1) a visible rectangular paste window around the head (sky
# mismatch inside the box), (2) a floating ghost scalp at the top of frame
# when the local box hits y=0, (3) clipped/doubled hair at the feather
# boundary. Replaced by crop_stitch_full_frame_head_clamp below — keep this
# flag OFF unless A/B'ing against the legacy local-box path.
crop_stitch_clamp_head_scale: false
# Full-frame similarity head-scale clamp (OFF by default until validated on
# the three cases that broke the local-box approach, including smooth-sky /
# desert plates where seams are most visible). When true: warp the ENTIRE
# stitched frame with a similarity transform mapping the generated face onto
# the original target face, THEN build a soft head+hair mask from where the
# transformed head landed, and alpha-blend over the whole frame. Guarantees
# no content is clipped by a pre-sized box. Debug dumps the feathered mask
# as full_frame_head_clamp_mask_*.png when save_debug=true.
crop_stitch_full_frame_head_clamp: false
# Cut 48 -> 16: the composite is `mask*warped + (1-mask)*original_scene`, i.e.
# the SAME two-different-scale-images-blended-through-a-soft-edge failure the
# local-box clamp had. A 48px feather reached far enough past the new (post-
# shrink) head's actual boundary to overlap where the ORIGINAL head really
# was in the untouched original_scene -- showing a translucent trace of it
# (GPU-observed 2026-08-11: visible ghost hovering above the real head, same
# defect as the local-box path before its own border_fill fix). A tighter
# feather keeps the blend zone close to the new head's true edge, well short
# of the old position for realistic shrink factors (~0.73-0.78 observed).
# Cut further 16 -> 10 alongside the alpha-tail snap added to
# clamp_edited_head_scale_full_frame (preprocess.py) -- 16 alone still showed
# a visible ghost on GPU (2026-08-11). No more test cycles available before
# this fix ships; both mitigations applied together, unverified pending next
# GPU run.
full_frame_head_clamp_mask_feather_px: 10
# Head+hair-only mask for the clamp composite (NOT the stitch mask extents).
# bot_extend=0.08 stops at the chin — using stitch's 0.40 pulled donor collar
# clothing into the result. top_extend=1.80 covers voluminous hair above the
# face box; coverage-intersect drops any mask mass on empty warp borders so
# black crown silhouettes cannot composite.
full_frame_head_clamp_mask_top_extend: 1.80
full_frame_head_clamp_mask_side_extend: 0.35
full_frame_head_clamp_mask_bot_extend: 0.08
full_frame_head_clamp_mask_expand_px: 6
# Pre-stitch clamp on the edited crop for single-person (soft-composited through
# the head mask). Does NOT call the post-stitch local-box paste above.
crop_stitch_pre_stitch_clamp: true
# Geometry RCA: dump S0–S4 face/head boxes (no recipe changes). Also on when save_debug.
head_scale_trace: false
multi_head_scale_prompt: true
# Force hairstyle transfer (body hair often survives without this).
multi_hair_replace_prompt: true
# When true: prompt forces body/scene expression + eye/head direction onto the
# result. When false: strip expression-lock and eye-direction-lock language and
# allow the donor identity's natural expression/gaze (not locked to body's
# sideways look). Does not change geometry/identity LoRA.
preserve_expression: false

# Per-image head-direction prompt hint. The generic "keep the same direction"
# instruction below doesn't reliably stop yaw/gaze drift on its own. When
# true, each run also measures the ACTUAL yaw/roll from the original photo's
# face landmarks and appends a concrete, image-specific hint (e.g. "the eye
# on the right sits higher -- an 8-degree tilt" / "the head is strongly
# turned off-center, study image 1's exact eye/nose/mouth alignment").
# Text-only -- unlike the pixel-warp corrections above (head_direction_relock,
# procrustes), a wrong or unhelpful hint cannot corrupt pixels, so this is
# the safer lever to reach for first. See estimate_head_direction_label in
# preprocess.py for exactly what is/isn't asserted and why.
head_direction_prompt_hint: true
# --- Headwear policy -------------------------------------------------------
# Diagnosed from a real failure: the target wore a hat with wide side flaps and
# the output showed a ghost oval above the head + "wings" at ear level. Those
# were the ORIGINAL HAT surviving, not invented hair -- the hat measured 100%
# inside the stitch mask, so it was never a coverage problem. The prompt named
# glasses but never headwear, while demanding the donor's hairstyle, so the
# model produced a hat/hair hybrid.
# preserve_headwear=true  -> keep the hat (it is clothing; keeps the original
#   silhouette so no occluded background has to be reconstructed).
# preserve_headwear=false -> remove it and reconstruct what it covered (harder).
headwear_prompt_policy: true
preserve_headwear: false

# Body-skin harmonization: shift arm/shoulder skin tone to match donor head.
# Runs post-composite, zero generative calls, head pixels structurally untouched.
extend_skin_harmonization: true
skin_harmony_body_visible_thresh: 0.09   # min fraction of person px below head
skin_harmony_feather_px: 20              # mask blur radius at sleeve/collar edges
# Raised from 0.80 (2026-08-18): GPU-confirmed the change was too subtle to
# read as "recolored" on real renders. transfer_strength multiplies the
# per-pixel skin-likeness weight, which is already <1 for most real skin
# pixels (a moderately-confident match, e.g. an arm in harsher light, scored
# ~0.36 in local testing) -- at 0.80 that only reaches ~29% blend opacity.
# 1.0 = don't discount an already-uncertain match a second time.
skin_harmony_transfer_strength: 1.0    # blend weight (0=off, 1=full transfer)

head_direction_roll_deg_thresh: 3.0
head_direction_yaw_thresh: 0.12
head_direction_yaw_strong_thresh: 0.30

prompt: >-
  Replace the person's head, face, and hair in the first image with the person
  from the second image. Preserve the exact facial identity of the second person —
  bone structure, jawline, eyebrows, eyes, nose, mouth, and skin.
  CRITICAL: use the hairstyle, hairline, hair length, and hair color from the
  second image — completely remove and replace the original hair from the first
  image (do not keep the first person's hair on top of the new face).
  CRITICAL: copy the facial expression from the first image exactly — if they
  are smiling, the result must smile the same way; if they are not smiling,
  do not add a smile. Keep mouth shape, smile/no-smile, eye gaze, and
  micro-expressions from the first image only — never from the second image.
  CRITICAL: keep the head facing the exact same direction as the first image —
  do not turn, rotate, or angle the head to the left or right, and do not tilt
  it. The eyes must look in the exact same direction as the first image, not
  toward the camera or off to a side if the first image does not. Head yaw,
  pitch, and roll must exactly match the first image.
  Keep the body, clothing, pose, head rotation, camera angle, lighting, and
  background from the first image. Match the original head size and neck seam —
  do not enlarge the head. Use face and hair identity from the second image; do not
  copy clothing, collar, bowtie, or shoulders from the second image. If other
  people are visible, leave them completely unchanged. Remove the original face
  and glasses from the first person. Photorealistic, natural skin texture,
  sharp details, lighting matched to the first image.

negative_prompt: ""

# Post-generation head-direction relock. Prompt text alone doesn't reliably
# stop the model from drifting head yaw / eye gaze toward the donor face or a
# frontal default. When true, after crop_stitch/full_frame produce the final
# composited image, the generated face's 5 landmarks are re-aligned (rotation
# + uniform scale + translation only, no shear/stretch) onto the ORIGINAL
# photo's landmarks, then blended back through a tight face-only mask so
# hair/body/quality are untouched -- only eye/head orientation is corrected.
# OFF by default: on a real (non-mock) run this produced a severely broken
# result (a large misplaced duplicate of hair/head content) once, almost
# certainly a bad landmark match sending the affine estimate to an
# implausible transform. relock_pose_to_destination now rejects any
# transform outside min_scale/max_scale/max_rotation_deg/max_translate_frac
# instead of applying it, but this hasn't yet been re-validated on GPU with
# that safeguard in place -- re-enable only after confirming it on real
# photos.
head_direction_relock: false
# Partial affine (similarity: rotation+scale+translation) is the safe default
# -- no shear/stretch, so it can't distort the face. Full affine allows shear
# too, which can better match some poses but risks visible warping.
head_direction_relock_full_affine: false
head_direction_relock_feather_px: 21
head_direction_relock_stitch_feather_px: 10
head_direction_relock_core_min_alpha: 0.90
head_direction_relock_expand_px: 6
head_direction_relock_blur_px: 8
head_direction_relock_top_extend: 0.12
head_direction_relock_side_extend: 0.12
head_direction_relock_bot_extend: 0.05
# Reject the recovered transform (keep the unwarped generated face) outside
# these bounds -- guards against a bad landmark match producing a wild warp.
head_direction_relock_min_scale: 0.75
head_direction_relock_max_scale: 1.35
head_direction_relock_max_rotation_deg: 20.0
head_direction_relock_max_translate_frac: 0.20

# Tight face ref — include enough donor hair above face; stop at jawline/chin to exclude clothing.
face_side_pad: 0.22
face_top_pad: 0.70
face_bot_pad: 0.02
include_shoulders: false
tight_identity_crop: true

# --- EXPERIMENT E1: sampling-time containment (OFF by default) ---
# When true AND edit_mode=crop_stitch, the sampler is seeded with the ENCODED
# scene latent and the existing stitch mask is attached as `noise_mask`, so
# ComfyUI re-pins every latent outside the mask to the source at each step
# (comfy/samplers.py:641). Verified safe at denoise=1.0: Krea2 is
# ModelType.FLUX, so CONST.noise_scaling multiplies latent_image by
# (1 - sigma) = 0 at sigma_max -- the starting noise is unchanged. Reuses the
# existing mask; changes no other geometry, denoise, or blending.
# Known risk: distilled/Turbo LoRAs have been reported to make noise_mask a
# silent no-op on other flow DiTs. If the output is identical to the input,
# that is the cause -- not the wiring.
sampling_containment: false

# --- Isolated-layer composite (replaces stitch+harmonize+restore+clamp) ---
# When true, the generated head is kept as an RGBA layer and composited onto
# the untouched original exactly once. Structurally prevents ghost/dark-rect/
# collar-leak bugs from the old modify-whole-frame cycle.
crop_stitch_isolated_layer: true

# --- Two-pass generation (identity lock then realism refine) ---
# Pass A: main generation at full ref_boost (structure/identity lock).
# Pass B: img2img at low denoise so only texture/naturalism is refined.
# Enable independently for A/B before combining with other flags.
crop_stitch_two_pass: false
two_pass_b_denoise: 0.20
two_pass_b_ref_boost: 4.0
two_pass_b_steps: 4

# --- Region-masked ref_boost for crop_stitch ---
# Builds a landmark mask (eyes/nose/mouth/jaw) over the scene crop and applies
# strong ref_boost only inside that mask, baseline outside. Lets identity be
# pushed hard on recognition-critical features without over-processing hair.
crop_stitch_ref_boost_mask: false

# --- Union-bbox crop sizing ---
# Expands the crop box to hold the donor's actual head+hair height (measured
# from face detection on the donor reference image) instead of a fixed
# padding multiplier. Prevents hair clipping when donor hair is tall.
crop_stitch_union_bbox: false

# simple_full_body: restore the ORIGINAL body below the shoulder line after
# the full-body generative pass. A head swap must not alter clothing,
# shoulders or background, but the full-body pass repaints the whole frame
# (observed: a high robe collar replaced by bare neck + shoulders showing
# past the garment). Both images are pixel-aligned at the same resolution
# here -- no warp/rescale -- so this cannot produce the geometric-mismatch
# ghosting that the old crop_stitch compositing did.
simple_full_body_restore_body: true
# Keep the GENERATED neck this far below the chin (as a fraction of face
# height) -- the neck must stay generated because it carries the donor's
# skin tone into the collar.
simple_full_body_neck_keep_frac: 0.35
# ...then ramp to fully-original by this fraction below the chin.
simple_full_body_shoulder_frac: 1.10

# Bottom extent of the face-refine blend mask, as a fraction of face height.
# Deliberately NOT mask_bot_extend (0.40): that is tuned for crop_stitch where
# the face is a small part of the frame. In simple_full_body the face can be a
# third of the frame, so 0.40 reaches past the chin onto the shoulders -- and
# since the refine is a separate generation, it then composites a second,
# different render of the shoulder over the main frame (measured: mask reached
# y=327 with shoulders starting ~y=300). Keep this small so the refine stays
# on the face and neck.
# 0.12 still overlapped: measured chin y=286, mask reached y=309, shoulders
# begin ~y=300 -> 9px of overlap, enough for a faint edge. 0.06 reaches y=297
# and clears by 3px. This framing has only ~14px of visible neck, so the mask
# has very little room; on the robed case (small face) this shrinks the neck
# band from ~10px to ~5px, which is worth watching for a jaw seam.
refine_mask_bot_extend: 0.06
