name: krea2_full_image_synth
pipeline: krea2_full_image_synth

# Experimental: full-image Krea2 Identity Edit with ZERO post-localization.
# Does NOT modify configs/krea2_identity_edit.yaml (localized production path).
#
# Identity-path design (see pipeline docstring):
#   - Face-filled identity canvas (NOT letterboxed into scene) — fit_mode handles AR
#   - Replace head/face/hair prompt (trained swap vocabulary)
#   - ref_boost high on image-2; ref_boost_a neutral on scene
#   - grounding_px 768 for stronger edit adherence on replacement
#   - ref_boost_mask focuses image-2 attention on the face

unet_name: krea2_turbo_fp8_scaled.safetensors
clip_name: qwen3vl_4b_fp8_scaled.safetensors
clip_type: krea2
vae_name: qwen_image_vae.safetensors

identity_lora_name: krea2_identity_edit_v1_2_r64.safetensors
identity_lora_strength: 1.0

steps: 12
cfg: 1.0
sampler: euler
scheduler: simple
seed: 46
denoise: 1.0

apply_timestep_shift: true
timestep_shift_mu: 1.15
timestep_base_shift: 0.5

force_full_load: true
skip_negative_grounding: true
debug_count_unet_forwards: false
torch_compile: false
save_debug: true
verbose: true

# Image-2 identity boost (author/community strong range ~2–6).
# Image-1 scene boost stays neutral — boosting scene locks target geometry.
ref_boost: 5.0
ref_boost_a: 1.0
# Docs: lower grounding → stronger edit adherence; higher → more ref likeness.
# For replacement edits, 768 balances change vs likeness better than 1024.
grounding_px: 768
fit_mode: fit
max_dim: 1024
div_by: 16

# Face-dominant identity canvas (critical — do not letterbox into scene).
identity_long_side: 768
identity_square_fill: true
identity_fill_frac: 0.92
identity_white_bg: true
use_ref_boost_mask: true

# Target face selection for multi-person scenes.
face_select_policy: largest
face_index: 0

# Tight identity crop — match production krea2 pads (include donor hair, no jersey).
face_side_pad: 0.22
face_top_pad: 0.70
face_bot_pad: 0.12

use_vlm_caption: false
instruction_suffix: null
prompt_prefix: null

negative_prompt: ""
