name: krea2_full_image_synth
pipeline: krea2_full_image_synth

# Experimental: full-image Krea2 Identity Edit with ZERO post-localization.
# Does NOT modify configs/krea2_identity_edit.yaml (localized production path).
#
# Settings follow conradlocke/krea2-identity-edit recommendations for
# maximizing identity transfer on full-frame two-ref edits:
#   Turbo + CFG 1.0
#   12 steps (upper end of 8–12; more steps → face detail)
#   ref_boost 4.0 (author strong-likeness starting point)
#   grounding_px 1024 (higher → stronger identity/likeness)
#   fit_mode fit (v1.2 geometry)
#   long side 1024 (~1MP class; multi-person card suggests ~1–1.5MP)

unet_name: krea2_turbo_fp8_scaled.safetensors
clip_name: qwen3vl_4b_fp8_scaled.safetensors
clip_type: krea2
vae_name: qwen_image_vae.safetensors

identity_lora_name: krea2_identity_edit_v1_2_r64.safetensors
identity_lora_strength: 1.0

steps: 12
cfg: 1.0
sampler: euler
scheduler: simple
seed: 46
denoise: 1.0

apply_timestep_shift: true
timestep_shift_mu: 1.15
timestep_base_shift: 0.5

force_full_load: true
skip_negative_grounding: true
debug_count_unet_forwards: false
torch_compile: false
save_debug: true
verbose: true

# Identity-max dials (distinct from localized crop defaults: 3.5 / 768 / 8).
ref_boost: 4.0
ref_boost_a: 1.2
grounding_px: 1024
fit_mode: fit
max_dim: 1024
div_by: 16

# Target face selection for multi-person scenes.
face_select_policy: largest
face_index: 0

# Identity reference crop pads (head only — no shoulders).
face_side_pad: 0.35
face_top_pad: 0.65
face_bot_pad: 0.15

# Optional VLM caption (off by default — heuristic scene describe is enough).
use_vlm_caption: false

# Optional override appended after auto scene description.
# Leave null to use the built-in identity-replacement instruction.
instruction_suffix: null
prompt_prefix: null

negative_prompt: ""
